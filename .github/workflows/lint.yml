name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linters
        run: |
          brew install swiftformat swiftlint

      - name: Run SwiftFormat
        run: |
          swiftformat . --lint

      - name: Run SwiftLint
        run: |
          swiftlint lint --strict